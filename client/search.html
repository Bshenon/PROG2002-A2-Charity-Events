<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Events - T1D Hope</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>T1D Hope</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="search.html">Search Events</a>
        </nav>
    </header>

    <main>
        <section class="search-section">
            <h2>Search Charity Events</h2>
            <p>Find upcoming T1D Hope events by date, location or category.</p>

            <form id="search-form">

                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date">
                </div>

                <div class="form-group">
                    <label for="location">Location</label>
                    <input
                        type="text"
                        id="location"
                        placeholder="e.g. Perth"
                    >
                </div>

                <div class="form-group">
                    <label for="category">Category</label>

                    <select id="category">
                        <option value="">All Categories</option>
                    </select>
                </div>

                <button type="submit" class="search-button">
                    Search Events
                </button>

            </form>
        </section>

        <section class="search-results-section">
            <h2>Search Results</h2>

            <div id="search-results">
                <p>Use the search options above to find events.</p>
            </div>
        </section>
    </main>

    <script src="search.js"></script>

</body>
</html>
